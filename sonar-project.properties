sonar.projectKey=gigabit-clowns_rexlib
sonar.organization=gigabit-clowns

sonar.sources=src, include, python, plugins/cuda/src, .github
sonar.tests=tests, plugins/cuda/tests
sonar.exclusions=docs/**

sonar.cfamily.compile-commands=build/compile_commands.json
sonar.python.version=3.11, 3.12, 3.13, 3.14, 3.15

sonar.coverageReportPaths=build/coverage-sonarqube.xml
sonar.python.coverage.reportPaths=build/coverage/coverage-python.xml
sonar.coverage.exclusions=python/src/**

sonar.issue.ignore.multicriteria=binding_operators, binding_type_slots, binding_modules, raw_memory_allocator, raw_memory_dlpack, raw_memory_symbols, platform_macros, locked_actions, locked_builds
sonar.issue.ignore.multicriteria.binding_operators.ruleKey=cpp:S1764
sonar.issue.ignore.multicriteria.binding_operators.resourceKey=python/src/**
sonar.issue.ignore.multicriteria.binding_type_slots.ruleKey=cpp:S3630
sonar.issue.ignore.multicriteria.binding_type_slots.resourceKey=python/src/core/ndarray/array.cpp
sonar.issue.ignore.multicriteria.binding_modules.ruleKey=cpp:S995
sonar.issue.ignore.multicriteria.binding_modules.resourceKey=python/src/**
sonar.issue.ignore.multicriteria.raw_memory_allocator.ruleKey=cpp:S5008
sonar.issue.ignore.multicriteria.raw_memory_allocator.resourceKey=plugins/cuda/src/hardware/caching_allocator/**
sonar.issue.ignore.multicriteria.raw_memory_dlpack.ruleKey=cpp:S5008
sonar.issue.ignore.multicriteria.raw_memory_dlpack.resourceKey=python/src/core/ndarray/dlpack*
sonar.issue.ignore.multicriteria.raw_memory_symbols.ruleKey=cpp:S5008
sonar.issue.ignore.multicriteria.raw_memory_symbols.resourceKey=src/core/system/dynamic_library_handle_*
sonar.issue.ignore.multicriteria.platform_macros.ruleKey=cpp:S5028
sonar.issue.ignore.multicriteria.platform_macros.resourceKey=include/rexlib/core/platform/**
sonar.issue.ignore.multicriteria.locked_actions.ruleKey=githubactions:S7637
sonar.issue.ignore.multicriteria.locked_actions.resourceKey=.github/workflows/**
sonar.issue.ignore.multicriteria.locked_builds.ruleKey=githubactions:S8541
sonar.issue.ignore.multicriteria.locked_builds.resourceKey=.github/workflows/**
