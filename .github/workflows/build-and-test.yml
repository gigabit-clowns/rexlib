name: Build and Test

on:
  push:
    branches:
      - main
    paths-ignore:
      - LICENSE
      - '**.md'
      - .github/workflows/clean-up-caches.yml
      - .github/workflows/codeql-actions.yml
      - .github/workflows/codeql-cpp.yml
      - .github/workflows/documentation.yml
      - .github/workflows/keep-caches-warm.yml
      - .github/workflows/release.yml
      - .gitignore
      - .vscode/**
      - doc/**
      - logos/**
      - renovate.json

  pull_request:
    branches:
      - main

  workflow_dispatch:

concurrency:
  group: build-and-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_and_test_with_cmake:
    name: CMake
    permissions:
      contents: read
    strategy:
      matrix:
        os:
        - ubuntu-latest
        - ubuntu-22.04
        compiler: 
        - {c: gcc, cxx: g++}
        - {c: clang, cxx: clang++}

        include:
        - os: macos-latest
          compiler: {c: clang, cxx: clang++}
        - os: windows-latest
          compiler: {c: cl, cxx: cl}
          generator: "Ninja"
        - os: windows-latest
          compiler: {c: gcc, cxx: g++}
          generator: "Ninja"
        - os: windows-11-arm
          compiler: {c: cl, cxx: cl}
          generator: "Ninja"
        - os: windows-11-arm
          compiler: {c: gcc, cxx: g++}
          generator: "Ninja"

    env:
      BUILD_TYPE: Debug
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install coverage tool
        id: install-coverage
        if: matrix.compiler.c != 'cl' && matrix.compiler.cxx != 'cl'
        uses: gigabit-clowns/.github/.github/composites/install-cpp-coverage-tool@main
        with:
          compiler-c: ${{ matrix.compiler.c }}
          compiler-cxx: ${{ matrix.compiler.cxx }}

      # Ninja does not locate MSVC on its own the way the Visual Studio
      # generator does; without this the configure step finds no cl.exe.
      - name: Set up MSVC environment
        if: matrix.compiler.cxx == 'cl'
        uses: gigabit-clowns/.github/.github/composites/setup-msvc@main

      - name: Install memcheck tool
        if: matrix.os == 'ubuntu-latest'
        uses: gigabit-clowns/.github/.github/composites/memcheck/install-memtool@main

      - name: Set up compiler cache
        uses: gigabit-clowns/.github/.github/composites/restore-ccache@main
        with:
          key: ${{ matrix.os }}-${{ matrix.compiler.cxx }}
          max-size: 1G

      - name: Restore the fetched sources
        id: fetched
        uses: gigabit-clowns/.github/.github/composites/restore-fetched@main
        with:
          key: ${{ hashFiles('CMakeLists.txt', 'tests/CMakeLists.txt', 'cmake/modules/rexlib_add_*.cmake') }}

      - name: Configure and build with CMake
        uses: threeal/cmake-action@725d1314ccf9ea922805d7e3f9d9bcbca892b406 # v2
        with:
          source-dir: ${{ github.workspace }}
          build-dir: "${{ github.workspace }}/build"
          c-compiler: ${{ matrix.compiler.c }}
          cxx-compiler: ${{ matrix.compiler.cxx }}
          generator: ${{ matrix.generator }}
          options: |
            CMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}
            CMAKE_EXPORT_COMPILE_COMMANDS=ON
            FETCHCONTENT_BASE_DIR=${{ steps.fetched.outputs.dir }}
            REXLIB_ENABLE_COVERAGE=ON
            REXLIB_REGISTER_TESTS_PER_BINARY=ON
            CMAKE_C_COMPILER_LAUNCHER=ccache
            CMAKE_CXX_COMPILER_LAUNCHER=ccache
            ${{ matrix.compiler.cxx == 'cl' && 'CMAKE_MSVC_DEBUG_INFORMATION_FORMAT=Embedded' || '' }}
          run-build: true
          build-args: --config ${{ env.BUILD_TYPE }}

      - name: Save the fetched sources
        if: github.ref == 'refs/heads/main'
        uses: gigabit-clowns/.github/.github/composites/save-fetched@main

      - name: Save the compiler cache
        if: github.ref == 'refs/heads/main'
        uses: gigabit-clowns/.github/.github/composites/save-ccache@main
        with:
          key: ${{ matrix.os }}-${{ matrix.compiler.cxx }}

      - name: Run tests without memory check
        if: matrix.os != 'ubuntu-latest'
        uses: gigabit-clowns/.github/.github/composites/run-ctest@main

      - name: Run tests with memory check
        id: run-ctest
        if: matrix.os == 'ubuntu-latest'
        uses: gigabit-clowns/.github/.github/composites/run-ctest@main
        with:
          check-memleaks: true

      - name: Show memory leak logs (if exist)
        if: steps.run-ctest.outputs.exist-memleaks == 'true'
        uses: gigabit-clowns/.github/.github/composites/memcheck/show-memleaks@main
        with:
          test-numbers: ${{ steps.run-ctest.outputs.memleak-test-numbers }}

      - name: Generate coverage report
        if: matrix.compiler.c != 'cl' && matrix.compiler.cxx != 'cl'
        uses: gigabit-clowns/.github/.github/composites/run-ctest/coverage-report@main
        with:
          compiler-c: ${{ matrix.compiler.c }}
          compiler-cxx: ${{ matrix.compiler.cxx }}
          cl-coverage-tool: ${{ steps.install-coverage.outputs.opencppcoverage-pwsh }}
          report-path: ${{ github.workspace }}/coverage.lcov

      - name: Upload coverage report
        if: matrix.compiler.c != 'cl' && matrix.compiler.cxx != 'cl'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-report-${{ matrix.os }}-${{ matrix.compiler.c }}-${{ matrix.compiler.cxx }}
          path: coverage.lcov

      - name: Upload build files for sonar (ubuntu-latest + gcc only)
        uses: gigabit-clowns/.github/.github/composites/upload-sonar-build-files@main
        if: matrix.os == 'ubuntu-latest' && matrix.compiler.c == 'gcc'
        with:
          build-artifact-name: sonar-build-files

  build_with_system_dependencies:
    name: CMake with system dependencies
    permissions:
      contents: read
    runs-on: ubuntu-latest
    env:
      BUILD_TYPE: Release
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install the dependencies the distribution carries
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libboost-container-dev \
            libboost-filesystem-dev \
            libeigen3-dev \
            libspdlog-dev \
            catch2

      # half and pocketfft are packaged nowhere, so a system build of them is
      # a packager dropping the header on the include path. Doing the same
      # here is what covers Findhalf.cmake and Findpocketfft.cmake.
      - name: Place the headers no distribution packages
        # Bump alongside the half version in CMakeLists.txt.
        env:
          HALF_SHA256: 76ddbf406e9d9b772ec73af2bf925b38b290b4390cc4064720a08d4b4bca0aa9
        run: |
          commit=$(sed -n 's/.*rexlib_add_pocketfft(COMMIT \([^)]*\)).*/\1/p' CMakeLists.txt)
          version=$(sed -n 's/.*rexlib_add_half(VERSION \([^) ]*\).*/\1/p' CMakeLists.txt)
          curl -fsS -o pocketfft_hdronly.h \
            "https://raw.githubusercontent.com/mreineck/pocketfft/${commit}/pocketfft_hdronly.h"
          # SourceForge always redirects to a geo-selected mirror, so this
          # download has to follow redirects; the checksum is what makes
          # trusting whichever mirror answers unnecessary.
          curl -fsSL --proto '=https' --proto-redir '=https' -o half.zip \
            "https://downloads.sourceforge.net/project/half/half/${version}/half-${version}.zip"
          echo "${HALF_SHA256}  half.zip" | sha256sum -c -
          unzip -q half.zip -d half
          sudo install -m 644 pocketfft_hdronly.h half/include/half.hpp /usr/local/include/

      - name: Set up compiler cache
        uses: gigabit-clowns/.github/.github/composites/restore-ccache@main
        with:
          key: ubuntu-latest-system-dependencies
          max-size: 1G

      - name: Configure and build with CMake
        uses: threeal/cmake-action@725d1314ccf9ea922805d7e3f9d9bcbca892b406 # v2
        with:
          source-dir: ${{ github.workspace }}
          build-dir: "${{ github.workspace }}/build"
          c-compiler: gcc
          cxx-compiler: g++
          options: |
            CMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}
            REXLIB_USE_SYSTEM_BOOST=ON
            REXLIB_USE_SYSTEM_SPDLOG=ON
            REXLIB_USE_SYSTEM_HALF=ON
            REXLIB_USE_SYSTEM_POCKETFFT=ON
            REXLIB_USE_SYSTEM_EIGEN=ON
            REXLIB_USE_SYSTEM_CATCH2=ON
            CMAKE_C_COMPILER_LAUNCHER=ccache
            CMAKE_CXX_COMPILER_LAUNCHER=ccache
          run-build: true
          build-args: --config ${{ env.BUILD_TYPE }}

      - name: Save the compiler cache
        if: github.ref == 'refs/heads/main'
        uses: gigabit-clowns/.github/.github/composites/save-ccache@main
        with:
          key: ubuntu-latest-system-dependencies

      # A system build must not drag a dependency into the install: every one
      # of them is private and none appears in a public header.
      - name: Check that no dependency reached the install
        run: |
          cmake --install build --prefix "${{ runner.temp }}/install"
          found=$(find "${{ runner.temp }}/install" \
            \( -iname '*catch*' -o -iname '*eigen*' -o -iname '*spdlog*' \
               -o -iname '*boost*' -o -iname '*half*' -o -iname '*pocketfft*' \) \
            -print)
          if [ -n "$found" ]; then
            echo "A dependency reached the install tree:"
            echo "$found"
            exit 1
          fi

  sonar-scan:
    name: SonarQube scan
    permissions:
      contents: read
    needs: build_and_test_with_cmake
    runs-on: ubuntu-latest
    steps:
      - name: Merge the coverage reports
        uses: gigabit-clowns/.github/.github/composites/merge-cpp-coverage-reports@main
        with:
          coverage-pattern: "coverage-report-*"
          coverage-path: ${{ github.workspace }}/build
          report-path: ${{ github.workspace }}/build/coverage.xml
          show-coverage: true

      - name: SonarQube Scan
        uses: gigabit-clowns/.github/.github/composites/sonar-scan@main
        with:
          sonar-token: ${{ secrets.SONAR_TOKEN }}
          build-artifact-name: "sonar-build-files"
