name: Deploy release
permissions: {}

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
    branches:
      - main

  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/deploy.yml'

  workflow_dispatch:

jobs:
  build_doxygen:
    name: Build Doxygen documentation
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - name: Setup Pages
      uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

    - name: Install dependencies
      run: sudo apt-get update && sudo apt-get install -y doxygen

    - name: Configure and build with CMake
      uses: threeal/cmake-action@725d1314ccf9ea922805d7e3f9d9bcbca892b406 # v2
      with:
        source-dir: ${{ github.workspace }}
        build-dir: "${{ github.workspace }}/build"
        options: |
          REXLIB_BUILD_DOC=ON
          BUILD_TESTING=OFF
        run-build: true
        build-args: --target doxygen

    - name: Upload artifact
      uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
      with:
        path: ${{ github.workspace }}/build/doc/doxygen/html

  build_archive:
    name: Build the ${{ matrix.config }} archive for ${{ matrix.platform }}
    permissions:
      contents: read
    strategy:
      matrix:
        include:
        - platform: linux-x86_64
          os: ubuntu-22.04
          compiler: {c: gcc, cxx: g++}
          archive: tar.gz
          config: release
        - platform: macos-arm64
          os: macos-latest
          compiler: {c: clang, cxx: clang++}
          archive: tar.gz
          config: release
        - platform: windows-x86_64
          os: windows-latest
          compiler: {c: cl, cxx: cl}
          archive: zip
          config: release
        - platform: windows-x86_64
          os: windows-latest
          compiler: {c: cl, cxx: cl}
          archive: zip
          config: debug
        - platform: windows-arm64
          os: windows-11-arm
          compiler: {c: cl, cxx: cl}
          archive: zip
          config: release
        - platform: windows-arm64
          os: windows-11-arm
          compiler: {c: cl, cxx: cl}
          archive: zip
          config: debug

    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash -el {0}
    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - name: Set up MSVC environment
      if: matrix.compiler.cxx == 'cl'
      shell: pwsh
      run: |
        $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
        $install = & $vswhere -latest -products * `
          -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
          -property installationPath
        if (-not $install) { throw 'No Visual Studio installation with the C++ tools' }
        $vcvars = Join-Path $install 'VC\Auxiliary\Build\vcvars64.bat'
        cmd /c "`"$vcvars`" && set" |
          Where-Object { $_ -match '^([^=]+)=(.*)$' } |
          ForEach-Object { "$($Matches[1])=$($Matches[2])" } |
          Add-Content -Path $env:GITHUB_ENV -Encoding utf8

    - name: Set up compiler cache
      uses: hendrikmuhs/ccache-action@d62db5f07c26379fc4b4e0916f098a92573c3b03 # v1.2.23
      with:
        key: ${{ matrix.config }}-${{ matrix.platform }}
        max-size: 500M

    - name: Configure and build with CMake
      uses: threeal/cmake-action@725d1314ccf9ea922805d7e3f9d9bcbca892b406 # v2
      with:
        source-dir: ${{ github.workspace }}
        build-dir: "${{ github.workspace }}/build"
        c-compiler: ${{ matrix.compiler.c }}
        cxx-compiler: ${{ matrix.compiler.cxx }}
        generator: ${{ matrix.compiler.cxx == 'cl' && 'Ninja' || '' }}
        options: |
          CMAKE_BUILD_TYPE=${{ matrix.config == 'debug' && 'Debug' || 'Release' }}
          CMAKE_INSTALL_PREFIX=${{ github.workspace }}/stage
          BUILD_TESTING=OFF
          CMAKE_C_COMPILER_LAUNCHER=ccache
          CMAKE_CXX_COMPILER_LAUNCHER=ccache
        run-build: true
        build-args: --config ${{ matrix.config == 'debug' && 'Debug' || 'Release' }}

    - name: Install into the staging directory
      run: |
        cmake --install build \
          --config ${{ matrix.config == 'debug' && 'Debug' || 'Release' }} \
          ${{ matrix.config == 'release' && '--strip' || '' }}

    - name: Read the version
      id: version
      run: echo "version=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_OUTPUT"

    - name: Archive the staging directory
      id: archive
      env:
        NAME: rexlib-${{ steps.version.outputs.version }}-${{ matrix.platform }}-${{ matrix.config }}.${{ matrix.archive }}
      run: |
        cd stage
        if [ "${{ matrix.archive }}" = zip ]; then
          cmake -E tar cf "../$NAME" --format=zip -- .
        else
          cmake -E tar czf "../$NAME" -- .
        fi
        echo "name=$NAME" >> "$GITHUB_OUTPUT"

    - name: Upload artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        name: archive-${{ matrix.platform }}-${{ matrix.config }}
        path: ${{ steps.archive.outputs.name }}

  publish_archives:
    name: Publish the archives
    needs: [build_archive]
    permissions:
      contents: write
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - name: Download the archives
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
      with:
        pattern: archive-*
        path: archives
        merge-multiple: true

    - name: Move the development tag to the built commit
      if: github.ref == 'refs/heads/main'
      run: |
        git tag --force development
        git push --force origin refs/tags/development

    - name: Create the development release
      if: github.ref == 'refs/heads/main'
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh release view development > /dev/null 2>&1 || gh release create development \
          --prerelease \
          --title "Development build" \
          --notes "Built from the head of main. Assets are replaced on every push."

    - name: Create the version release
      if: startsWith(github.ref, 'refs/tags/v')
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" \
          --title "$GITHUB_REF_NAME" \
          --generate-notes

    - name: Upload the archives
      env:
        GH_TOKEN: ${{ github.token }}
        TAG: ${{ github.ref == 'refs/heads/main' && 'development' || github.ref_name }}
      run: gh release upload "$TAG" archives/* --clobber

  deploy_doxygen_to_gh_pages:
    name: Deploy Doxygen documentation to GitHub Pages
    needs: [build_doxygen]
    permissions:
      pages: write
      id-token: write
    if: github.event_name == 'push' && startsWith(github.event.ref, 'refs/tags/v')
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
