name: Clean up caches
permissions: {}

on:
  workflow_run:
    workflows:
      - Build and Test
    types:
      - completed
    branches:
      - main

  workflow_dispatch:
    inputs:
      scope:
        description: Which caches go
        required: true
        type: choice
        options:
          - superseded
          - all
        default: superseded
      ref:
        description: Ref or branch to clean. The one this runs from when empty.
        required: false
        type: string

jobs:
  # Every ref: a superseded entry is dead wherever it sits, since the newest
  # of its prefix is the only one that will ever be restored.
  after_a_build:
    permissions:
      actions: write
    name: Delete the caches a newer run has replaced
    if: github.event_name == 'workflow_run'
    uses: gigabit-clowns/.github/.github/workflows/clean-up-caches.yml@main
    with:
      scope: superseded
      ref: main
      patterns: &patterns |
        ccache-ubuntu-latest-g++-*
        ccache-ubuntu-latest-clang++-*
        ccache-ubuntu-latest-system-dependencies-*
        ccache-ubuntu-22.04-g++-*
        ccache-ubuntu-22.04-clang++-*
        ccache-macos-latest-clang++-*
        ccache-windows-latest-cl-*
        ccache-windows-latest-g++-*
        ccache-windows-11-arm-cl-*
        ccache-windows-11-arm-g++-*
        fetched-Linux-*
        fetched-macOS-*
        fetched-Windows-*

  on_request:
    permissions:
      actions: write
    name: Delete ${{ inputs.scope }} caches
    if: github.event_name == 'workflow_dispatch'
    uses: gigabit-clowns/.github/.github/workflows/clean-up-caches.yml@main
    with:
      scope: ${{ inputs.scope }}
      ref: ${{ inputs.ref != '' && inputs.ref || github.ref_name }}
      patterns: *patterns
