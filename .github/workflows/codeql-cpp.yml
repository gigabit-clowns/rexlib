name: CodeQL Cpp

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/codeql-cpp.yml
      - CMakeLists.txt
      - cmake/**
      - src/**

  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/codeql-cpp.yml
      - CMakeLists.txt
      - cmake/**
      - src/**

  schedule:
    - cron: '37 3 * * 1'

  workflow_dispatch:

permissions: {}

concurrency:
  group: codeql-cpp-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          languages: c-cpp
          build-mode: manual

      - name: Restore the fetched sources
        id: fetched
        uses: gigabit-clowns/.github/.github/composites/restore-fetched@main
        with:
          key: ${{ hashFiles('CMakeLists.txt', 'tests/CMakeLists.txt', 'cmake/modules/rexlib_add_*.cmake') }}

      # No compiler cache here.
      - name: Build the library
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=OFF \
            -DFETCHCONTENT_BASE_DIR=${{ steps.fetched.outputs.dir }}
          cmake --build build --parallel 2

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          category: /language:c-cpp
