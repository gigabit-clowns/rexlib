# SPDX-License-Identifier: GPL-3.0-only

name: CI

on:
  pull_request:

  push:
    branches:
      - main

  workflow_call:

  workflow_dispatch:

# A newer push to a pull request cancels the run it supersedes; runs on main
# are never cancelled, since each one saves the caches pull requests start
# from.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CMAKE_GENERATOR: Ninja
  CMAKE_BUILD_PARALLEL_LEVEL: 4
  CTEST_PARALLEL_LEVEL: 4
  CCACHE_BASEDIR: ${{ github.workspace }}
  CCACHE_NOHASHDIR: 1
  CCACHE_SLOPPINESS: time_macros,include_file_mtime,include_file_ctime,locale

jobs:
  # One row per platform and toolchain rexlib supports, with warnings as
  # errors and every dependency installed by vcpkg, and the Python binding
  # where a row names a Python. The oldest gcc and clang of the supported LTS
  # images are among them; the newest clang is what the sanitizer jobs build
  # with.
  build-and-test:
    name: ${{ matrix.name }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          # - name: Linux x86_64, gcc, coverage and valgrind
          #   os: ubuntu-24.04
          #   cc: gcc
          #   cxx: g++
          #   triplet: x64-linux
          #   preset: coverage
          - name: Linux x86_64, clang
            os: ubuntu-22.04
            cc: clang
            cxx: clang++
            triplet: x64-linux
            preset: debug
            python: '3.14'
          - name: Linux aarch64, gcc
            os: ubuntu-22.04-arm
            cc: gcc
            cxx: g++
            triplet: arm64-linux
            preset: debug
            python: '3.14'
          - name: macOS arm64, Apple clang
            os: macos-15
            cc: clang
            cxx: clang++
            triplet: arm64-osx
            preset: debug
            python: '3.14'
          - name: Windows x86_64, MSVC
            os: windows-2025
            cc: cl
            cxx: cl
            msvc: x64
            triplet: x64-windows-static-md
            preset: debug
            python: '3.14'
          - name: Windows arm64, MSVC
            os: windows-11-arm
            cc: cl
            cxx: cl
            msvc: arm64
            triplet: arm64-windows-static-md
            preset: debug
            python: '3.14'
          - name: Windows x86_64, MinGW
            os: windows-2025
            cc: gcc
            cxx: g++
            triplet: x64-mingw-static
            preset: debug
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
      SONAR_TOKEN: ${{ matrix.preset == 'coverage' && secrets.SONAR_TOKEN || '' }}
    steps:
      # Sonar reads the history to tell new code from old.
      - name: Check out the repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          fetch-depth: ${{ matrix.preset == 'coverage' && 0 || 1 }}

      # Ninja does not find MSVC on its own, as the Visual Studio generator
      # does.
      - name: Set up MSVC
        if: matrix.msvc
        uses: ilammy/msvc-dev-cmd@v1.13.0
        with:
          arch: ${{ matrix.msvc }}

      - name: Install valgrind and gcovr
        if: matrix.preset == 'coverage'
        run: |
          sudo apt-get update
          sudo apt-get install --yes valgrind
          pipx install gcovr==8.7

      - name: Keep the packages vcpkg builds
        uses: actions/cache@v6.1.0
        with:
          path: ${{ runner.temp }}/vcpkg-archives
          key: vcpkg-${{ matrix.os }}-${{ matrix.cxx }}-${{ matrix.triplet }}-${{ hashFiles('.github/vcpkg/vcpkg.json') }}
          restore-keys: vcpkg-${{ matrix.os }}-${{ matrix.cxx }}-${{ matrix.triplet }}-

      - name: Install the dependencies
        run: |
          mkdir -p "$RUNNER_TEMP/vcpkg-archives"
          vcpkg install --x-manifest-root=.github/vcpkg \
            --x-install-root="$RUNNER_TEMP/vcpkg" \
            --triplet=${{ matrix.triplet }} \
            --host-triplet=${{ matrix.triplet }} \
            --binarysource="clear;files,$RUNNER_TEMP/vcpkg-archives,readwrite"

      - name: Set up uv, Python and a virtual environment
        if: matrix.python
        uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: ${{ matrix.python }}
          activate-environment: true

      - name: Install the binding's dependencies
        if: matrix.python
        run: uv sync --locked --no-install-project

      - name: Set up the compiler cache
        uses: hendrikmuhs/ccache-action@v1.2.24
        with:
          key: ${{ matrix.os }}-${{ matrix.cxx }}-${{ matrix.preset }}
          max-size: 500M
          evict-old-files: job
          install: binary

      # MSVC keeps its debug information beside each object only when it is
      # embedded, which is what lets ccache cache what it compiles.
      - name: Configure
        env:
          CMAKE_C_COMPILER_LAUNCHER: ccache
          CMAKE_CXX_COMPILER_LAUNCHER: ccache
        run: >-
          cmake --preset ${{ matrix.preset }}
          -DREXLIB_USE_SYSTEM_DEPENDENCIES=ON
          -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/vcpkg/${{ matrix.triplet }}"
          -DREXLIB_WARNINGS_AS_ERRORS=ON
          ${{ matrix.python && '-DREXLIB_BUILD_PYTHON=ON' || '' }}
          ${{ matrix.msvc && '-DCMAKE_MSVC_DEBUG_INFORMATION_FORMAT=Embedded' || '' }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Test
        if: matrix.preset != 'coverage'
        run: ctest --preset ${{ matrix.preset }}

      # ctest looks for what -T needs in the directory it is given, not in
      # that of a test preset, so this one names the build directory.
      - name: Test under valgrind
        if: matrix.preset == 'coverage'
        run: >-
          ctest --test-dir build/coverage -T MemCheck
          --output-on-failure --no-tests=error

      - name: Show what valgrind found
        if: failure() && matrix.preset == 'coverage'
        run: >-
          find build/coverage/Testing/Temporary -name 'MemoryChecker.*.log'
          -size +0 -exec tail -n 200 {} +

      - name: Measure the coverage
        if: matrix.preset == 'coverage'
        run: >-
          gcovr --root . --object-directory build/coverage
          --merge-lines --exclude-throw-branches --exclude-unreachable-branches
          --sonarqube build/coverage/coverage.xml --print-summary

      - name: Scan with SonarQube
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@v8.3.0

  # The default build, with the dependencies fetched and built with rexlib.
  sanitize:
    name: ${{ matrix.name }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Address and undefined behaviour sanitizers
            preset: sanitize
          - name: Thread sanitizer
            preset: sanitize-thread
    runs-on: ubuntu-24.04
    env:
      CC: clang
      CXX: clang++
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up the compiler cache
        uses: hendrikmuhs/ccache-action@v1.2.24
        with:
          key: ubuntu-24.04-clang++-${{ matrix.preset }}
          max-size: 500M
          evict-old-files: job
          install: binary

      - name: Keep the fetched sources
        uses: actions/cache@v6.1.0
        with:
          path: |
            ${{ runner.temp }}/fetched
            !${{ runner.temp }}/fetched/*-build
          key: fetched-${{ runner.os }}-${{ hashFiles('**/CMakeLists.txt', '**/*.cmake') }}
          restore-keys: fetched-${{ runner.os }}-

      - name: Configure
        env:
          CMAKE_C_COMPILER_LAUNCHER: ccache
          CMAKE_CXX_COMPILER_LAUNCHER: ccache
        run: cmake --preset ${{ matrix.preset }} -DFETCHCONTENT_BASE_DIR="$RUNNER_TEMP/fetched"

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Test
        run: ctest --preset ${{ matrix.preset }}

  # The one job without presets, which need CMake 3.21, and so the one that
  # holds cmake_minimum_required to its word. Release, with warnings as errors
  # and every dependency installed by vcpkg. The library is installed, and
  # the Python binding, with the oldest Python it supports, is built alone
  # against that install, as a distribution packages the two.
  minimum-cmake:
    name: CMake 3.18
    timeout-minutes: 60
    runs-on: ubuntu-24.04
    env:
      CC: gcc
      CXX: g++
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Keep the packages vcpkg builds
        uses: actions/cache@v6.1.0
        with:
          path: ${{ runner.temp }}/vcpkg-archives
          key: vcpkg-ubuntu-24.04-g++-x64-linux-${{ hashFiles('.github/vcpkg/vcpkg.json') }}
          restore-keys: vcpkg-ubuntu-24.04-g++-x64-linux-

      - name: Install the dependencies
        run: |
          mkdir -p "$RUNNER_TEMP/vcpkg-archives"
          vcpkg install --x-manifest-root=.github/vcpkg \
            --x-install-root="$RUNNER_TEMP/vcpkg" \
            --triplet=x64-linux \
            --host-triplet=x64-linux \
            --binarysource="clear;files,$RUNNER_TEMP/vcpkg-archives,readwrite"

      - name: Install CMake 3.18
        run: |
          python3 -m venv "$RUNNER_TEMP/cmake"
          "$RUNNER_TEMP/cmake/bin/pip" install --quiet cmake==3.18.0
          "$RUNNER_TEMP/cmake/bin/cmake" --version

      - name: Set up uv, Python and a virtual environment
        uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: '3.11'
          activate-environment: true

      - name: Install the binding's dependencies
        run: uv sync --locked --no-install-project

      - name: Set up the compiler cache
        uses: hendrikmuhs/ccache-action@v1.2.24
        with:
          key: ubuntu-24.04-g++-minimum-cmake
          max-size: 500M
          evict-old-files: job
          install: binary

      - name: Configure
        env:
          CMAKE_C_COMPILER_LAUNCHER: ccache
          CMAKE_CXX_COMPILER_LAUNCHER: ccache
        run: >-
          "$RUNNER_TEMP/cmake/bin/cmake" -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DREXLIB_USE_SYSTEM_DEPENDENCIES=ON
          -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/vcpkg/x64-linux"
          -DREXLIB_WARNINGS_AS_ERRORS=ON

      - name: Build
        run: >-
          "$RUNNER_TEMP/cmake/bin/cmake" --build build

      - name: Test
        working-directory: build
        run: >-
          "$RUNNER_TEMP/cmake/bin/ctest" --output-on-failure --no-tests=error

      - name: Install
        run: >-
          "$RUNNER_TEMP/cmake/bin/cmake" --install build
          --prefix "$RUNNER_TEMP/rexlib"

      - name: Configure the binding
        env:
          CMAKE_C_COMPILER_LAUNCHER: ccache
          CMAKE_CXX_COMPILER_LAUNCHER: ccache
        run: >-
          "$RUNNER_TEMP/cmake/bin/cmake" -S python -B build-python
          -DCMAKE_BUILD_TYPE=Release
          -DREXLIB_USE_SYSTEM_DEPENDENCIES=ON
          -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/rexlib;$RUNNER_TEMP/vcpkg/x64-linux"
          -DREXLIB_WARNINGS_AS_ERRORS=ON

      - name: Build the binding
        run: >-
          "$RUNNER_TEMP/cmake/bin/cmake" --build build-python

      - name: Test the binding
        working-directory: build-python
        run: >-
          "$RUNNER_TEMP/cmake/bin/ctest" --output-on-failure --no-tests=error

  # The CUDA plugin, built as a third party builds a plugin: against the
  # library, installed. The toolkit comes from NVIDIA's repository, every
  # other dependency is installed by vcpkg, and warnings are errors. The
  # CUDA 12 row builds the plugin with CMake 3.18. The runners have no GPU,
  # so the tests that need one skip themselves.
  cuda:
    name: ${{ matrix.name }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: CUDA 12, Linux x86_64
            os: ubuntu-24.04
            repository: x86_64
            cuda: '12.9'
            triplet: x64-linux
            cmake: '3.18.0'
          - name: CUDA 13, Linux aarch64
            os: ubuntu-24.04-arm
            repository: sbsa
            cuda: '13.4'
            triplet: arm64-linux
    runs-on: ${{ matrix.os }}
    env:
      CC: gcc
      CXX: g++
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Keep the packages vcpkg builds
        uses: actions/cache@v6.1.0
        with:
          path: ${{ runner.temp }}/vcpkg-archives
          key: vcpkg-${{ matrix.os }}-g++-${{ matrix.triplet }}-${{ hashFiles('.github/vcpkg/vcpkg.json') }}
          restore-keys: vcpkg-${{ matrix.os }}-g++-${{ matrix.triplet }}-

      - name: Install the dependencies
        run: |
          mkdir -p "$RUNNER_TEMP/vcpkg-archives"
          vcpkg install --x-manifest-root=.github/vcpkg \
            --x-install-root="$RUNNER_TEMP/vcpkg" \
            --triplet=${{ matrix.triplet }} \
            --host-triplet=${{ matrix.triplet }} \
            --binarysource="clear;files,$RUNNER_TEMP/vcpkg-archives,readwrite"

      - name: Install the CUDA toolkit
        env:
          REPOSITORY: https://developer.download.nvidia.com/compute/cuda/repos/ubuntu2404/${{ matrix.repository }}
          CUDA: ${{ matrix.cuda }}
        run: |
          curl -fsSLO "$REPOSITORY/cuda-keyring_1.1-1_all.deb"
          sudo dpkg -i cuda-keyring_1.1-1_all.deb
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            "cuda-nvcc-${CUDA/./-}" "cuda-cudart-dev-${CUDA/./-}"

      - name: Set up the compiler cache
        uses: hendrikmuhs/ccache-action@v1.2.24
        with:
          key: ${{ matrix.os }}-g++-cuda-${{ matrix.cuda }}
          max-size: 500M
          evict-old-files: job
          install: binary

      - name: Configure the library
        env:
          CMAKE_C_COMPILER_LAUNCHER: ccache
          CMAKE_CXX_COMPILER_LAUNCHER: ccache
        run: >-
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DREXLIB_BUILD_TESTING=OFF
          -DREXLIB_USE_SYSTEM_DEPENDENCIES=ON
          -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/vcpkg/${{ matrix.triplet }}"
          -DREXLIB_WARNINGS_AS_ERRORS=ON

      - name: Build the library
        run: cmake --build build

      - name: Install the library
        run: cmake --install build --prefix "$RUNNER_TEMP/rexlib"

      - name: Use CMake ${{ matrix.cmake }} from here on
        if: matrix.cmake
        env:
          CMAKE: ${{ matrix.cmake }}
        run: |
          python3 -m venv "$RUNNER_TEMP/cmake"
          "$RUNNER_TEMP/cmake/bin/pip" install --quiet "cmake==$CMAKE"
          "$RUNNER_TEMP/cmake/bin/cmake" --version
          echo "$RUNNER_TEMP/cmake/bin" >> "$GITHUB_PATH"

      # One architecture is enough to compile for, and the oldest that CUDA 13
      # still supports.
      - name: Configure the plugin
        env:
          CMAKE_C_COMPILER_LAUNCHER: ccache
          CMAKE_CXX_COMPILER_LAUNCHER: ccache
          CMAKE_CUDA_COMPILER_LAUNCHER: ccache
          TOOLKIT: /usr/local/cuda-${{ matrix.cuda }}
        run: >-
          cmake -S plugins/cuda -B build-cuda
          -DCMAKE_BUILD_TYPE=Debug
          -DREXLIB_CUDA_USE_SYSTEM_DEPENDENCIES=ON
          -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/rexlib;$RUNNER_TEMP/vcpkg/${{ matrix.triplet }}"
          -DCUDAToolkit_ROOT="$TOOLKIT"
          -DCMAKE_CUDA_COMPILER="$TOOLKIT/bin/nvcc"
          -DCMAKE_CUDA_ARCHITECTURES=75
          -DREXLIB_CUDA_WARNINGS_AS_ERRORS=ON

      - name: Build the plugin
        run: cmake --build build-cuda

      - name: Test the plugin
        working-directory: build-cuda
        run: ctest --output-on-failure --no-tests=error

  # The source distribution, which the wheels are built from.
  sdist:
    name: Source distribution
    timeout-minutes: 10
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.3

      - name: Build the source distribution
        run: uv build --sdist

      - name: Keep the source distribution
        uses: actions/upload-artifact@v7.0.2
        with:
          name: sdist
          path: dist/*.tar.gz

  # The wheels of every platform one is shipped for, each built by
  # cibuildwheel from the source distribution: one per CPython before 3.12,
  # one abi3 wheel for 3.12 and every later CPython, and one per free-threaded
  # CPython. Each is tested by importing it, on every interpreter it serves.
  # The compiler cache carries the library from one interpreter's build to
  # the next.
  wheels:
    name: Wheels, ${{ matrix.name }}
    needs: sdist
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            os: ubuntu-24.04
          - name: Linux aarch64
            os: ubuntu-24.04-arm
          - name: macOS arm64
            os: macos-15
            ccache-basedir: /
          - name: Windows x86_64
            os: windows-2025
            msvc: x64
            ccache-basedir: 'C:/'
          - name: Windows arm64
            os: windows-11-arm
            msvc: arm64
            ccache-basedir: 'C:/'
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Fetch the source distribution
        uses: actions/download-artifact@v8.0.2
        with:
          name: sdist
          path: dist

      - name: Find the source distribution
        id: sdist
        run: echo "path=$(ls dist/*.tar.gz)" >> "$GITHUB_OUTPUT"

      # Ninja does not find MSVC on its own, as the Visual Studio generator
      # does.
      - name: Set up MSVC
        if: matrix.msvc
        uses: ilammy/msvc-dev-cmd@v1.13.0
        with:
          arch: ${{ matrix.msvc }}

      - name: Set up the compiler cache
        uses: hendrikmuhs/ccache-action@v1.2.24
        with:
          key: ${{ matrix.os }}-wheels
          max-size: 1G
          evict-old-files: job
          install: binary

      # Each wheel is built in a directory of its own inside the unpacked
      # sources, and the cache rewrites paths relative to it. On Linux the
      # wheels are built in a container, which sees the runner's files under
      # /host.
      - name: Build the wheels
        uses: pypa/cibuildwheel@v4.3.5
        with:
          package-dir: ${{ steps.sdist.outputs.path }}
        env:
          CIBW_CONFIG_SETTINGS: build-dir=build/{wheel_tag}
          CMAKE_C_COMPILER_LAUNCHER: ccache
          CMAKE_CXX_COMPILER_LAUNCHER: ccache
          CCACHE_BASEDIR: ${{ matrix.ccache-basedir }}
          CIBW_ENVIRONMENT_LINUX: >-
            CMAKE_BUILD_PARALLEL_LEVEL=4
            CMAKE_C_COMPILER_LAUNCHER=/host/usr/local/bin/ccache
            CMAKE_CXX_COMPILER_LAUNCHER=/host/usr/local/bin/ccache
            CCACHE_DIR=/host${{ github.workspace }}/.ccache
            CCACHE_BASEDIR=/
            CCACHE_NOHASHDIR=1
            CCACHE_SLOPPINESS=time_macros,include_file_mtime,include_file_ctime,locale
            CCACHE_MAXSIZE=1G

      # The container wrote the cache as root.
      - name: Give the compiler cache back to the runner
        if: always() && runner.os == 'Linux'
        run: sudo chown -R "$(id -u):$(id -g)" "$GITHUB_WORKSPACE/.ccache"

      - name: Keep the wheels
        uses: actions/upload-artifact@v7.0.2
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl

  documentation:
    name: Documentation
    timeout-minutes: 20
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install Doxygen
        run: |
          sudo apt-get update
          sudo apt-get install --yes doxygen

      - name: Keep the fetched sources
        uses: actions/cache@v6.1.0
        with:
          path: |
            ${{ runner.temp }}/fetched
            !${{ runner.temp }}/fetched/*-build
          key: fetched-${{ runner.os }}-${{ hashFiles('**/CMakeLists.txt', '**/*.cmake') }}
          restore-keys: fetched-${{ runner.os }}-

      - name: Configure
        run: cmake --preset docs -DFETCHCONTENT_BASE_DIR="$RUNNER_TEMP/fetched"

      - name: Build
        run: cmake --build --preset docs

      - name: Keep the reference
        uses: actions/upload-artifact@v7.0.2
        with:
          name: documentation
          path: build/docs/docs/doxygen/html

  # The static checks: the lockfile of the actions, then, through the lint
  # preset, clang-tidy, pinned, on rexlib's own sources as they are built,
  # with every dependency installed by vcpkg, and the .editorconfig rules.
  lint:
    name: Lint
    timeout-minutes: 60
    runs-on: ubuntu-24.04
    env:
      CC: clang
      CXX: clang++
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Verify the lockfile of the actions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh extension install github/gh-actions-lock --pin v0.4.1
          gh actions-lock --verify

      - name: Install clang-tidy, editorconfig-checker and ruff
        run: |
          pipx install clang-tidy==23.1.3
          pipx install editorconfig-checker==3.11.1
          pipx install ruff==0.17.1

      - name: Keep the packages vcpkg builds
        uses: actions/cache@v6.1.0
        with:
          path: ${{ runner.temp }}/vcpkg-archives
          key: vcpkg-ubuntu-24.04-clang++-x64-linux-${{ hashFiles('.github/vcpkg/vcpkg.json') }}
          restore-keys: vcpkg-ubuntu-24.04-clang++-x64-linux-

      - name: Install the dependencies
        run: |
          mkdir -p "$RUNNER_TEMP/vcpkg-archives"
          vcpkg install --x-manifest-root=.github/vcpkg \
            --x-install-root="$RUNNER_TEMP/vcpkg" \
            --triplet=x64-linux \
            --host-triplet=x64-linux \
            --binarysource="clear;files,$RUNNER_TEMP/vcpkg-archives,readwrite"

      - name: Set up the compiler cache
        uses: hendrikmuhs/ccache-action@v1.2.24
        with:
          key: ubuntu-24.04-clang++-lint
          max-size: 500M
          evict-old-files: job
          install: binary

      - name: Configure
        env:
          CMAKE_C_COMPILER_LAUNCHER: ccache
          CMAKE_CXX_COMPILER_LAUNCHER: ccache
        run: >-
          cmake --preset lint
          -DREXLIB_USE_SYSTEM_DEPENDENCIES=ON
          -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/vcpkg/x64-linux"

      - name: Build
        run: cmake --build --preset lint

      - name: Test
        run: ctest --preset lint

  # The one check the branch rules require besides SonarCloud's. It runs
  # whatever happened before it, and fails unless every job it needs
  # succeeded: a job that a failure skipped would otherwise count as passed.
  all-checks:
    name: All checks
    timeout-minutes: 10
    if: always()
    needs:
      - build-and-test
      - sanitize
      - minimum-cmake
      - cuda
      - sdist
      - wheels
      - documentation
