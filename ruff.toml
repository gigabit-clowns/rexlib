target-version = "py39"

include = [
  "python/**/*.py",
  "tests/**/*.py",
  "scripts/**/*.py"
]

[lint]
select = ["E4", "E7", "E9", "F"]
extend-select = [
  "UP",   # pyupgrade
  "D",    # pydocstyle
  "PL",   # pylint
  "B",    # flake8-bugbear
  "C4",   # flake8-comprehensions
  "SIM",  # flake8-simplify
  "RET",  # flake8-return
  "PIE",  # flake8-pie
  "PERF", # perflint
  "RUF",  # ruff-specific rules
]
ignore = [
  "D206", # docstring-tab-indentation: the project indents with tabs
]

[lint.per-file-ignores]
"tests/**/*.py" = [
  "D",       # docstrings are not required in tests
  "PLC0414", # Useless import alias
  "PLR0913", # Too many arguments in function definition
  "PLR0917", # Too many positional arguments
  "PLR2004"  # Asserting against literal values is the point of a test
]
"python/rexlib/__init__.py" = [
  "D104", # __doc__ is re-exported from the compiled extension, not written here
]

[lint.pydocstyle]
convention = "pep257"
