name: Build and Test

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - .github/workflows/deploy.yml
      - .github/workflows/clean-up-caches.yml
      - .github/workflows/keep-caches-warm.yml
      - .github/workflows/release.yml
      - .gitignore
      - .vscode/**
      - LICENSE
      - pyproject.toml
      - renovate.json
      - scripts/**

  pull_request:

  workflow_dispatch:

concurrency:
  group: build-and-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_and_test_with_cmake:
    name: CMake
    permissions:
      contents: read
    strategy:
      matrix:
        os:
        - ubuntu-latest
        compiler: 
        - {cc: gcc, cxx: g++}
        - {cc: clang, cxx: clang++}
        cuda:
        - 12.8.1
        
        build_type:
        - Debug
        
        include:
        - os: ubuntu-22.04
          compiler: {cc: gcc, cxx: g++}
          cuda: 11.8.0
          build_type: Debug
        # Visual Studio 2026 is only supported from CUDA 13.2 onwards
        - os: windows-latest
          compiler: {cc: cl, cxx: cl}
          cuda: 13.3.1
          build_type: Debug
  
    runs-on: ${{ matrix.os }}
    env:
      BUILD_TYPE: ${{ matrix.build_type }}
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: true

      - uses: Jimver/cuda-toolkit@b8bf9c6c28f8a92fbb04dcfcaee872e60c57462d # v0.2.36
        id: cuda-toolkit
        with:
          cuda: ${{ matrix.cuda }}
          method: 'network'
          sub-packages: ${{ runner.os=='Linux' && '["nvcc", "cudart-dev"]' || '[]' }} # Fake ternary operator
          log-file-suffix: '${{matrix.os}}-${{matrix.compiler.cc}}-${{matrix.cuda}}.txt'

      - name: Set up MSVC environment
        if: runner.os == 'Windows'
        uses: gigabit-clowns/.github/.github/composites/setup-msvc@main

      - name: Set up compiler cache
        uses: gigabit-clowns/.github/.github/composites/restore-ccache@main
        with:
          key: ${{ matrix.os }}-${{ matrix.compiler.cxx }}-${{ matrix.cuda }}
          max-size: 1G

      - name: Restore the fetched sources
        id: fetched
        uses: gigabit-clowns/.github/.github/composites/restore-fetched@main
        with:
          key: ${{ hashFiles('CMakeLists.txt', 'cmake/modules/fetch_*.cmake', 'tests/CMakeLists.txt', 'external/rexlib/CMakeLists.txt', 'external/rexlib/cmake/modules/fetch_*.cmake') }}

      - name: Install rexlib
        env:
          CMAKE_GENERATOR: Ninja
          MSVC_DEBUG_FORMAT: ${{ matrix.compiler.cxx == 'cl' && '-DCMAKE_MSVC_DEBUG_INFORMATION_FORMAT=Embedded' || '' }}
        run: |
          cmake -S external/rexlib -B "${{ runner.temp }}/rexlib-build" \
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
            -DCMAKE_INSTALL_PREFIX="${{ runner.temp }}/rexlib" \
            -DCMAKE_INSTALL_LIBDIR=lib \
            -DBUILD_TESTING=OFF \
            -DFETCHCONTENT_BASE_DIR=${{ steps.fetched.outputs.dir }} \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            $MSVC_DEBUG_FORMAT
          cmake --build "${{ runner.temp }}/rexlib-build" \
            --config ${{ env.BUILD_TYPE }} --target install --parallel 4

      - name: Configure and build with CMake
        uses: threeal/cmake-action@725d1314ccf9ea922805d7e3f9d9bcbca892b406 # v2
        with:
          source-dir: ${{ github.workspace }}
          build-dir: "${{ github.workspace }}/build"
          c-compiler: ${{ matrix.compiler.cc }}
          cxx-compiler: ${{ matrix.compiler.cxx }}
          generator: Ninja
          options: |
            CMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}
            CMAKE_EXPORT_COMPILE_COMMANDS=ON
            rexlib_ROOT=${{ runner.temp }}/rexlib
            FETCHCONTENT_BASE_DIR=${{ steps.fetched.outputs.dir }}
            CMAKE_C_COMPILER_LAUNCHER=ccache
            CMAKE_CXX_COMPILER_LAUNCHER=ccache
            ${{ matrix.compiler.cxx == 'cl' && 'CMAKE_MSVC_DEBUG_INFORMATION_FORMAT=Embedded' || '' }}
          run-build: true
          build-args: --config ${{ env.BUILD_TYPE }}

      - name: Save the fetched sources
        if: github.ref == 'refs/heads/main'
        uses: gigabit-clowns/.github/.github/composites/save-fetched@main

      - name: Save the compiler cache
        if: github.ref == 'refs/heads/main'
        uses: gigabit-clowns/.github/.github/composites/save-ccache@main
        with:
          key: ${{ matrix.os }}-${{ matrix.compiler.cxx }}-${{ matrix.cuda }}

      - name: Run tests
        working-directory: "${{ github.workspace }}/build"
        run: ctest -C ${{ env.BUILD_TYPE }} -T test --rerun-failed --output-on-failure

      - name: Upload compilation database (ubuntu-latest + gcc only)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: matrix.os == 'ubuntu-latest' && matrix.compiler.cc == 'gcc'
        with:
          name: build-artifact
          path: build

  sonar-scan:
    name: SonarQube scan
    permissions:
      contents: read
    needs: build_and_test_with_cmake
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: build-artifact
          path: ${{ github.workspace }}/build
    
      - name: SonarQube scan
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
