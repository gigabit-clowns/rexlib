name: Build and Test

on:
  pull_request:
  
  workflow_dispatch:

jobs:
  build_and_test_with_cmake:
    name: CMake
    permissions:
      contents: read
    strategy:
      matrix:
        os:
        - ubuntu-latest
        compiler: 
        - {cc: gcc, cxx: g++}
        - {cc: clang, cxx: clang++}
        cuda:
        - 12.8.1
        
        include:
        - os: ubuntu-22.04
          compiler: {cc: gcc, cxx: g++}
          cuda: 11.8.0
        # Visual Studio 2026 is only supported from CUDA 13.2 onwards, and it
        # is what the Windows runner ships. Older toolkits install no MSBuild
        # integration for it, which the CUDA language needs.
        - os: windows-latest
          compiler: {cc: cl, cxx: cl}
          cuda: 13.3.1
  
    runs-on: ${{ matrix.os }}
    env:
      BUILD_TYPE: Release
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: Jimver/cuda-toolkit@b8bf9c6c28f8a92fbb04dcfcaee872e60c57462d # v0.2.36
        id: cuda-toolkit
        with:
          cuda: ${{ matrix.cuda }}
          method: 'network'
          sub-packages: ${{ runner.os=='Linux' && '["nvcc", "toolkit"]' || '[]' }} # Fake ternary operator
          non-cuda-sub-packages: '["libcublas", "libcufft", "libcusolver"]'
          log-file-suffix: '${{matrix.os}}-${{matrix.compiler.cc}}-${{matrix.cuda}}.txt'

      - name: Install xmipp4-core
        working-directory: ${{ github.workspace }}/../
        run: |
          git clone https://github.com/gigabit-clowns/xmipp4-core.git
          cd xmipp4-core
          git checkout tags/development
          pip install --only-binary :all: --no-index --find-links=dist xmipp4-core

      - name: Configure and build with CMake
        uses: threeal/cmake-action@725d1314ccf9ea922805d7e3f9d9bcbca892b406 # v2
        with:
          source-dir: ${{ github.workspace }}
          build-dir: "${{ github.workspace }}/build"
          c-compiler: ${{ matrix.compiler.cc }}
          cxx-compiler: ${{ matrix.compiler.cxx }}
          options: |
            CMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}
            CMAKE_EXPORT_COMPILE_COMMANDS=ON
          run-build: true
          build-args: --config ${{ env.BUILD_TYPE }}

      - name: Run tests
        working-directory: "${{ github.workspace }}/build"
        run: ctest -C ${{ env.BUILD_TYPE }} -T test --rerun-failed --output-on-failure

      - name: Upload compilation database (ubuntu-latest + gcc only)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: matrix.os == 'ubuntu-latest' && matrix.compiler.cc == 'gcc'
        with:
          name: build-artifact
          path: build

  sonar-scan:
    name: SonarQube scan
    permissions:
      contents: read
    needs: build_and_test_with_cmake
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: build-artifact
          path: ${{ github.workspace }}/build
    
      - name: SonarQube scan
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
