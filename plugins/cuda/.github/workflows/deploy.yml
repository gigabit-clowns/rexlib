name: Deploy release

on:
  push:
    # A tag never has its paths evaluated, so a release still deploys whatever
    # it points at.
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
    branches:
      - main
    paths-ignore:
      - '**.md'
      - .github/workflows/build-and-test.yml
      - .github/workflows/release.yml
      - .gitignore
      - .vscode/**
      - LICENSE
      - renovate.json
      - sonar-project.properties

  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/deploy.yml'
      - 'pyproject.toml'

  workflow_dispatch:

concurrency:
  group: deploy-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_wheel_manylinux:
    name: Build wheels for manylinux_${{ matrix.platform.architecture }} cuda${{ matrix.cuda-major.version }}
    strategy:
      matrix:
        # One build per CUDA major: minor version compatibility makes the extra 
        # builds redundant, and the runtime now travels with the wheel so only 
        # the driver floor differs.
        cuda-major:
        - {version: 11, package: 11-8, home: /usr/local/cuda-11.8, runtime-dir: cuda_runtime}
        - {version: 12, package: 12-9, home: /usr/local/cuda-12.9, runtime-dir: cuda_runtime}
        - {version: 13, package: 13-0, home: /usr/local/cuda-13.0, runtime-dir: cu13}
        platform:
        - { runner: "ubuntu-latest", architecture: "x86_64", repo-architecture: "x86_64"}
        - { runner: "ubuntu-24.04-arm", architecture: "aarch64", repo-architecture: "sbsa"}

    runs-on: ${{ matrix.platform.runner }}
    env:
      RHEL8_NVIDIA_REPO: "https://developer.download.nvidia.com/compute/cuda/repos/rhel8/${{ matrix.platform.repo-architecture }}/cuda-rhel8.repo"
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: 3.13

      - name: Point pyproject.toml at this CUDA major
        run: >
          python scripts/select_cuda_major.py
          --input pyproject.toml
          --cuda-major ${{ matrix.cuda-major.version }}

      - name: Cache the container's compiler cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/ccache
          key: wheels-${{ matrix.platform.architecture }}-${{ github.run_id }}
          restore-keys: wheels-${{ matrix.platform.architecture }}-

      - name: Note when the container's cache was restored
        run: echo "CCACHE_RESTORED_AT=$(date -u +%s)" >> "$GITHUB_ENV"

      - name: Restore the fetched sources
        id: fetched
        uses: gigabit-clowns/.github/.github/composites/restore-fetched@main
        with:
          key: host-${{ hashFiles('CMakeLists.txt', 'cmake/modules/fetch_*.cmake', 'tests/CMakeLists.txt', 'external/rexlib/CMakeLists.txt', 'external/rexlib/cmake/modules/fetch_*.cmake') }}

      - name: Build wheels
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074 # v4.2.0
        env:
          CIBW_ARCHS: ${{ matrix.platform.architecture }}
          CIBW_BUILD: "cp313-manylinux*" # Python agnostic, pick any version
          CIBW_BUILD_VERBOSITY: 1
          # Based on: https://stackoverflow.com/a/77212119
          CIBW_BEFORE_ALL: |
            yum install -y wget
            command -v ccache || dnf install -y ccache || yum install -y ccache
            wget ${{ env.RHEL8_NVIDIA_REPO }} -O /etc/yum.repos.d/cuda.repo
            yum clean all
            yum -y install cuda-toolkit-${{ matrix.cuda-major.package }}
            python -m pip install "cmake>=3.23" ninja
            export CMAKE_GENERATOR=Ninja
            export CCACHE_DIR=/host/tmp/ccache CCACHE_BASEDIR=/ \
              CCACHE_NOHASHDIR=1 CCACHE_MAXSIZE=2G \
              CCACHE_SLOPPINESS=time_macros,include_file_mtime,include_file_ctime,locale
            cmake -S {project}/external/rexlib -B /tmp/rexlib-build \
              -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/tmp/rexlib \
              -DCMAKE_INSTALL_LIBDIR=lib -DBUILD_TESTING=OFF \
              -DFETCHCONTENT_BASE_DIR=/host/tmp/fetched \
              -DCMAKE_C_COMPILER_LAUNCHER=ccache \
              -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
            cmake --build /tmp/rexlib-build --config Release \
              --target install --parallel 4
          # The plugin sits at rexlib/lib/rexlib-plugins inside the wheel,
          # three levels below site-packages, where the runtime wheel unpacks.
          CIBW_ENVIRONMENT: >
            CUDAHOSTCXX=/usr/bin/g++
            CUDACXX=${{ matrix.cuda-major.home }}/bin/nvcc
            rexlib_ROOT=/tmp/rexlib
            CCACHE_DIR=/host/tmp/ccache
            CCACHE_BASEDIR=/
            CCACHE_NOHASHDIR=1
            CCACHE_MAXSIZE=2G
            CCACHE_SLOPPINESS=time_macros,include_file_mtime,include_file_ctime,locale
            SKBUILD_CMAKE_DEFINE="REXLIB_CUDA_RUNTIME_RPATH=$ORIGIN/../../../nvidia/${{ matrix.cuda-major.runtime-dir }}/lib;FETCHCONTENT_BASE_DIR=/host/tmp/fetched;CMAKE_C_COMPILER_LAUNCHER=ccache;CMAKE_CXX_COMPILER_LAUNCHER=ccache"
          CIBW_REPAIR_WHEEL_COMMAND_LINUX: >
            auditwheel repair -w {dest_dir} {wheel}
            --exclude "librexlib.so*"
            --exclude "libcudart.so*"

      - name: Drop what this job did not use
        if: github.ref == 'refs/heads/main'
        env:
          CCACHE_DIR: /tmp/ccache
        run: |
          command -v ccache > /dev/null || sudo apt-get install -y -qq ccache
          sudo chown -R "$(id -u):$(id -g)" "$CCACHE_DIR"
          ccache --evict-older-than "$(( $(date -u +%s) - CCACHE_RESTORED_AT ))s"

      - name: Save the container's compiler cache
        if: github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/ccache
          key: wheels-${{ matrix.platform.architecture }}-${{ github.run_id }}

      - name: Save the fetched sources
        if: github.ref == 'refs/heads/main'
        uses: gigabit-clowns/.github/.github/composites/save-fetched@main

      - name: Upload wheels
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: cibw-wheels-manylinux-${{ matrix.platform.architecture }}-cuda${{ matrix.cuda-major.version }}
          path: ./wheelhouse/*.whl

  upload_pypi:
    name: Upload to PyPI
    needs: [build_wheel_manylinux]
    if: github.event_name == 'push' && startsWith(github.event.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: cibw-*
          path: dist
          merge-multiple: true

      - name: List artifacts
        run: ls -l ./dist

      - name: Upload to PyPI # TODO enable this in the future
        if: false
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1

  create_developer_release:
    name: Create development release
    needs: [build_wheel_manylinux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: github.event_name == 'push' && github.event.ref == 'refs/heads/main'
    env:
      TAG_NAME: "development"
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Download artifacs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: "cibw-*"
          path: dist
          merge-multiple: true

      - name: Create or update development tag
        run: |
          git config --global user.name 'GitHub Actions'
          git config --global user.email 'action@github.com'
          git add dist
          git commit -m "Add pre-built binaries"
          git tag -fa $TAG_NAME -m 'Update development tag with main branch'
          git push origin $TAG_NAME --force

      - name: Delete all old assets from development release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view $TAG_NAME --json assets -q ".assets[].name" | while read asset; do
            gh release delete-asset $TAG_NAME "$asset" -y
          done

      - name: Create or update development release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: "Development build"
          body: >-
            This is an automated release containing binaries built with 
            with the head of the main branch.
          draft: false
          prerelease: true
          files: dist/**
