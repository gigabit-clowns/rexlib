[build-system]
# HACK: rexlib is not set as build requirement: it is found through 
# CMAKE_PREFIX_PATH, which CI points at the prefix it builds from 
# external/rexlib. Add rexlib when it is published.
requires = ["scikit-build-core==1.0.3"]
build-backend = "scikit_build_core.build"

[project]
name = "rexlib-cuda12"
dynamic = ["version"]
authors = [
    { name = "Oier Lauzirika Zarrabeitia", email = "oierlauzi@bizkaia.eu" },
    { name = "Martín Salinas Antón", email = "ssalinasmartin@gmail.com" },
    { name = "Mikel Iceta Tena", email = "m.icetatena@gmail.com" },
]
description = "CUDA hardware backend for rexlib"
classifiers = [
	"Topic :: Scientific/Engineering :: Image Processing",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Operating System :: POSIX",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Programming Language :: C++"
]

readme = {file = "README.md", content-type = "text/markdown"}
license = {file = "LICENSE"}

requires-python = ">=3.9"
dependencies = [
    "rexlib==0.1.*",
    "cuda-toolkit[cudart]==12.*"
]

[project.urls]
Homepage = "https://github.com/gigabit-clowns/rexlib-cuda"

[tool.scikit-build]
# rexlib reports its plugin directory relative to its own prefix, which
# inside a wheel is the rexlib package rather than site-packages.
wheel.install-dir = "rexlib"
wheel.py-api = "py3" # Python version agnostic
cmake.version = ">=3.18"

build.verbose = false
cmake.build-type = "Release"

[tool.scikit-build.cmake.define]
REXLIB_CUDA_BUILD_TESTING = "OFF"

[tool.scikit-build.metadata.version]
provider = "scikit_build_core.metadata.regex"
input = "VERSION"
regex = "(?P<value>\\d+\\.\\d+\\.\\d+)"
