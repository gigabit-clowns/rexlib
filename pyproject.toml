[build-system]
requires = [
    "scikit-build-core==1.0.3"
]
build-backend = "scikit_build_core.build"

[project]
name = "rexlib-native"
dynamic = ["version"]
authors = [
    { name = "Oier Lauzirika Zarrabeitia", email = "oierlauzi@bizkaia.eu" },
    { name = "Martín Salinas Antón", email = "ssalinasmartin@gmail.com" },
    { name = "Mikel Iceta Tena", email = "m.icetatena@gmail.com" },
]
description = "Device-agnostic array computing library with a pluggable backend architecture"
classifiers = [
    "Topic :: Scientific/Engineering :: Image Processing",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Operating System :: POSIX",
    "Operating System :: MacOS",
    "Operating System :: Windows",
    "Programming Language :: C++"
]

readme = {file = "README.md", content-type = "text/markdown"}
license = "GPL-3.0-only"

requires-python = ">=3.9"
dependencies = []

[project.urls]
Homepage = "https://github.com/gigabit-clowns/rexlib"

[tool.scikit-build]
experimental=true # For wheel.install-dir
wheel.install-dir="/data"
wheel.py-api = "py3" # Python version agnostic
cmake.version = ">=3.16"
cmake.build-type = "Release"

[tool.scikit-build.metadata.version]
provider = "scikit_build_core.metadata.regex"
input = "VERSION"
regex = "(?P<value>\\d+\\.\\d+\\.\\d+)"

[tool.scikit-build.cmake.define]
BUILD_TESTING = "OFF"
CMAKE_INSTALL_LIBDIR = "lib" # avoid using lib64
