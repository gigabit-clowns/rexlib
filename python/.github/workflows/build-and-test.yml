name: Build and test

on:
  pull_request:

  workflow_dispatch:

jobs:
  build_with_cmake:
    name: CMake
    strategy:
      matrix:
        os:
        - ubuntu-latest
        compiler: 
        - {cc: gcc, cxx: g++}
        - {cc: clang, cxx: clang++}
        
        include:
        - os: macos-latest
          compiler: {cc: clang, cxx: clang++}
        - os: windows-latest
          compiler: {cc: cl, cxx: cl}
        - os: windows-11-arm
          compiler: {cc: cl, cxx: cl}

    runs-on: ${{ matrix.os }}
    env:
      BUILD_TYPE: Debug
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: true

      # Most of the wall clock here is rexlib itself, which is built once
      # and then found by the project. Caching makes every run after the
      # first a link.
      - name: Set up compiler cache
        uses: hendrikmuhs/ccache-action@d62db5f07c26379fc4b4e0916f098a92573c3b03 # v1.2.23
        with:
          key: ${{ matrix.os }}-${{ matrix.compiler.cxx }}
          max-size: 1G

      - name: Install rexlib
        run: |
          python -m pip install "cmake>=3.18" ninja
          cmake -S external/rexlib -B "${{ runner.temp }}/rexlib-build" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="${{ runner.temp }}/rexlib" \
            -DBUILD_TESTING=OFF \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build "${{ runner.temp }}/rexlib-build" \
            --config Release --parallel 4
          # Everything except the namelink, which a wheel cannot hold.
          cmake --install "${{ runner.temp }}/rexlib-build" \
            --config Release --component rexlib_runtime
          cmake --install "${{ runner.temp }}/rexlib-build" \
            --config Release --component rexlib_development

      - name: Configure and build with CMake
        uses: threeal/cmake-action@725d1314ccf9ea922805d7e3f9d9bcbca892b406 # v2
        with:
          source-dir: ${{ github.workspace }}
          build-dir: "${{ github.workspace }}/build"
          c-compiler: ${{ matrix.compiler.cc }}
          cxx-compiler: ${{ matrix.compiler.cxx }}
          options: |
            CMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}
            rexlib_ROOT=${{ runner.temp }}/rexlib
            CMAKE_C_COMPILER_LAUNCHER=ccache
            CMAKE_CXX_COMPILER_LAUNCHER=ccache
          run-build: true
          build-args: --config ${{ env.BUILD_TYPE }}

  build_with_pip:
    name: pip
    strategy:
      matrix:
        os:
        - ubuntu-latest
        - ubuntu-22.04
        - macos-latest
        - windows-latest
        - windows-11-arm
        python-version:
        - '3.9'
        - '3.10'
        - '3.11'
        - '3.12'
        - '3.13'
        - '3.14'

        # CPython ships no Windows ARM64 build before 3.11.
        exclude:
        - os: windows-11-arm
          python-version: '3.9'
        - os: windows-11-arm
          python-version: '3.10'

    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: true
      
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
  
      - name: Upgrade pip
        if: matrix.os == 'ubuntu-22.04'
        run: python -m pip install --upgrade pip packaging

      - name: Install rexlib
        run: |
          python -m pip install "cmake>=3.18" ninja
          cmake -S external/rexlib -B "${{ runner.temp }}/rexlib-build" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="${{ runner.temp }}/rexlib" \
            -DBUILD_TESTING=OFF
          cmake --build "${{ runner.temp }}/rexlib-build" \
            --config Release --parallel 4
          # Everything except the namelink, which a wheel cannot hold.
          cmake --install "${{ runner.temp }}/rexlib-build" \
            --config Release --component rexlib_runtime
          cmake --install "${{ runner.temp }}/rexlib-build" \
            --config Release --component rexlib_development

      - name: Install with pip
        env:
          rexlib_ROOT: ${{ runner.temp }}/rexlib
        run: |
          pip install .[test] -v \
            -Ccmake.define.REXLIB_PYTHON_BUILD_TESTING=ON \
            -Ccmake.define.REXLIB_PYTHON_STAGE_PREFIX="${{ runner.temp }}/rexlib"

      - name: Run ruff
        run: ruff check .

      - name: Run tests
        run: |
          chmod +x ./scripts/run-tests.sh
          ./scripts/run-tests.sh
